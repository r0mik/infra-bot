[project]
name = "cluster-bot"
version = "0.1.0"
description = "Telegram bot that answers questions about a homelab from Prometheus and Alertmanager"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
