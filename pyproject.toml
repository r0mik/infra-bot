[project]
name = "ops-agent"
version = "0.1.0"
description = "Read-only LangGraph on-call agent for the homelab (Kubernetes, nodes, monitoring) in Telegram"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
