# ─── ops-agent: read-only identity in a cluster (apply in BOTH production and staging) ───
#   kubectl apply -f deploy/k8s/rbac.yaml
#
# Only get/list/watch. Deliberately absent: secrets, pods/exec, pods/attach, pods/portforward,
# nodes/proxy, services/proxy, serviceaccounts/token, and every write verb.
# tests/test_rbac.py fails if any of that sneaks in.
apiVersion: v1
kind: Namespace
metadata:
  name: ops-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-agent
  namespace: ops-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ops-agent-readonly
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, configmaps, events, persistentvolumeclaims,
                persistentvolumes, nodes, namespaces, serviceaccounts, replicationcontrollers,
                resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, gatewayclasses, httproutes, grpcroutes, referencegrants]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [applications, appprojects]
    verbs: [get, list, watch]
  - apiGroups: [bitnami.com]
    resources: [sealedsecrets]  # encrypted; the agent drops encryptedData anyway
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ops-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ops-agent-readonly
subjects:
  - kind: ServiceAccount
    name: ops-agent
    namespace: ops-agent
